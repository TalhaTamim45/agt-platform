<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="freshRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#b30000" />
    </linearGradient>
  </defs>
  <!-- Iconic Fresh Oval Pill Emblem -->
  <g transform="translate(15, 20)">
    <!-- Red Brand Capsule / Oval -->
    <rect x="0" y="5" width="165" height="110" rx="35" fill="url(#freshRed)" />
    <!-- White Inner Border Stroke -->
    <rect x="5" y="10" width="155" height="100" rx="30" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
    <!-- Fresh Script-Style Bold White Text -->
    <text x="82" y="75" font-family="'Brush Script MT', 'Arial Black', Impact, sans-serif" font-size="48" font-style="italic" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Fresh</text>
    <circle cx="140" cy="40" r="5" fill="#facc15" />
  </g>
  <!-- Tagline & MGI Subtitle -->
  <g transform="translate(200, 52)">
    <text x="0" y="24" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f172a" letter-spacing="1">FRESH</text>
    <text x="0" y="52" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="700" fill="#e60000" letter-spacing="0.5">Meghna Group of Industries</text>
    <text x="0" y="74" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">FMCG &amp; CONSUMER GOODS</text>
  </g>
</svg>