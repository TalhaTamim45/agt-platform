<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="460" height="270">
  <defs>
    <linearGradient id="stiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066d6" />
      <stop offset="100%" stop-color="#004bb5" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 15)">
    <!-- Top Dynamic Crescent Swoosh -->
    <path d="M 60 90 C 85 45 155 22 230 44 C 210 38 150 32 90 80 Z" fill="url(#stiBlue)" />
    
    <!-- 3 Ascending Satellite Dots -->
    <circle cx="270" cy="72" r="15" fill="url(#stiBlue)" />
    <circle cx="262" cy="40" r="10.5" fill="url(#stiBlue)" />
    <circle cx="248" cy="16" r="7" fill="url(#stiBlue)" />

    <!-- STI Core Lettering -->
    <g transform="translate(30, 10)">
      <!-- S -->
      <text x="30" y="145" font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" font-weight="900" font-size="115" fill="url(#stiBlue)" letter-spacing="-3px">S</text>
      <!-- T -->
      <text x="120" y="145" font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" font-weight="900" font-size="115" fill="url(#stiBlue)" letter-spacing="-3px">T</text>
      <!-- I -->
      <text x="215" y="145" font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" font-weight="900" font-size="115" fill="url(#stiBlue)">I</text>
      <!-- TM -->
      <text x="268" y="78" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="800" font-size="20" fill="url(#stiBlue)">TM</text>
    </g>

    <!-- Subtitle: Smart Trade International -->
    <text x="215" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="21" fill="url(#stiBlue)" letter-spacing="0.5px">Smart Trade International</text>

    <!-- Bottom Crescent Swooshes -->
    <!-- Inner bottom swoosh -->
    <path d="M 100 205 C 145 228 220 228 270 205 C 230 222 155 222 120 205 Z" fill="url(#stiBlue)" />
    <!-- Outer bottom swoosh -->
    <path d="M 108 222 C 160 252 235 252 295 220 C 245 245 165 245 125 222 Z" fill="url(#stiBlue)" />
  </g>
</svg>