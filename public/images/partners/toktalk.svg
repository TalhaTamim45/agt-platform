<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="tokRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <!-- Toktalk Artisan Jar / Badge Emblem -->
  <g transform="translate(20, 20)">
    <rect x="15" y="10" width="90" height="100" rx="20" fill="url(#tokRed)" />
    <!-- White Pickle Jar Outline -->
    <path d="M 40 22 L 80 22 L 75 32 L 45 32 Z" fill="#fef08a" />
    <circle cx="60" cy="62" r="24" fill="#ffffff" />
    <!-- Chili / Flavor Swirl -->
    <path d="M 52 70 Q 60 48 68 70" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="60" cy="54" r="3" fill="#dc2626" />
  </g>
  <!-- Toktalk Typography -->
  <g transform="translate(155, 46)">
    <text x="0" y="30" font-family="'Inter', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#991b1b" letter-spacing="1">TOK<tspan fill="#f59e0b">TALK</tspan></text>
    <text x="0" y="58" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" letter-spacing="0.5">Artisan Gourmet Pickles &amp; Jams</text>
    <text x="0" y="80" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">GOURMET FOOD BRAND</text>
  </g>
</svg>